name: Release
on:
  push:
    tags: ['[0-9]*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify version
        run: |
          node -e 'const m=require("./manifest.json");const p=require("./package.json");const v=require("./versions.json");if(m.version!==process.env.GITHUB_REF_NAME||m.version!==p.version||v[m.version]!==m.minAppVersion)process.exit(1)'
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --verify-tag --generate-notes
